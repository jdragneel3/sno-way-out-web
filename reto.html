<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Te retaron en Sno-Way Out</title>
<meta name="description" content="Supera su distancia en la misma pista de Sno-Way Out.">
<style>
  :root { --bg:#cfe8ff; --ink:#1d2f5a; --btn:#4bb34f; --btn-dark:#2f8a35; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16233f; --ink:#eaf2ff; } }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink);
         min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; box-sizing:border-box; }
  main { max-width:420px; }
  h1 { font-size:2rem; margin:0 0 8px; }
  p { font-size:1.1rem; line-height:1.4; }
  .meters { font-size:3rem; font-weight:800; margin:8px 0; }
  button { background:var(--btn); color:#fff; border:0; border-bottom:6px solid var(--btn-dark); border-radius:20px; padding:16px 28px;
           font-size:1.4rem; font-weight:700; cursor:pointer; width:100%; }
  button:active { border-bottom-width:2px; transform:translateY(4px); }
  small { display:block; margin-top:16px; opacity:.75; }
  a { color:inherit; }
</style>
</head>
<body>
<main>
  <h1 id="title">¡Te han retado!</h1>
  <p id="who">Alguien quiere que superes su distancia en Sno-Way Out, en su misma pista.</p>
  <div class="meters" id="meters"></div>
  <button id="go">Aceptar el reto</button>
  <small id="hint">Si no tienes el juego, te llevamos a Google Play.</small>
  <small><a href="index.html">Sno-Way Out</a></small>
</main>
<script>
  const STORE = "https://play.google.com/store/apps/details?id=com.unjuegomas.snowayout";
  const params = new URLSearchParams(location.search);
  const code = (params.get("c") || "").toUpperCase();
  const name = (params.get("n") || "Un amigo").slice(0, 16);
  const m = /^SNO-(\d{1,7})-(\d{1,6})$/.exec(code);
  if (m) {
    document.getElementById("meters").textContent = Number(m[2]).toLocaleString("es") + " m";
    document.getElementById("who").textContent = name + " te reta: supera su distancia en su misma pista.";
  } else {
    document.getElementById("go").textContent = "Abrir Sno-Way Out";
  }
  document.getElementById("go").addEventListener("click", () => {
    // Nada de "await" antes de navegar: Chrome solo abre apps (intent://) mientras el toque sigue "fresco".
    // El reto se copia con el mismo formato que usa el juego para leerlo al abrirse (sin esperar la respuesta).
    if (m) {
      try { navigator.clipboard.writeText(name + " te reta en Sno-Way Out: " + code).catch(() => {}); } catch (e) {}
    }
    if (/Android/i.test(navigator.userAgent)) {
      // Abre el juego si está instalado; si no, Chrome va a Google Play.
      const q = m ? "?c=" + encodeURIComponent(code) + "&n=" + encodeURIComponent(name) : "";
      location.href = "intent://reto" + q + "#Intent;scheme=snowayout;package=com.unjuegomas.snowayout;S.browser_fallback_url=" + encodeURIComponent(STORE) + ";end";
    } else {
      location.href = STORE;
    }
  });
</script>
</body>
</html>
